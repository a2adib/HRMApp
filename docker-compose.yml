services:
  postgres:
    image: postgres:16-alpine
    container_name: hrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hrm_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hrm_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: hrm_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60"
    environment:
      DJANGO_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-change-in-production-12345}
      DB_NAME: ${DB_NAME:-hrm_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WIFI_INGESTION_SERVICE_TOKEN: ${WIFI_INGESTION_SERVICE_TOKEN:-hrm-internal-service-token-wifi-collector-2026}
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media

  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: hrm_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DJANGO_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-change-in-production-12345}
      DB_NAME: ${DB_NAME:-hrm_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WIFI_INGESTION_SERVICE_TOKEN: ${WIFI_INGESTION_SERVICE_TOKEN:-hrm-internal-service-token-wifi-collector-2026}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: hrm_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      DJANGO_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-change-in-production-12345}
      DB_NAME: ${DB_NAME:-hrm_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WIFI_INGESTION_SERVICE_TOKEN: ${WIFI_INGESTION_SERVICE_TOKEN:-hrm-internal-service-token-wifi-collector-2026}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: hrm_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  mediafiles:
