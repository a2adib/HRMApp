components:
  schemas:
    AccessPoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        office_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        mac_address:
          type: string
          maxLength: 32
        ip_address:
          type: string
          nullable: true
        location_description:
          type: string
          nullable: true
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        organization:
          type: string
          format: uuid
        office:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - mac_address
      - name
      - office
      - office_name
      - organization
      - updated_at
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - ADJUST
      - AUTH
      type: string
      description: |-
        * `CREATE` - Create Entity
        * `UPDATE` - Update Entity
        * `DELETE` - Delete Entity
        * `ADJUST` - Attendance Adjustment
        * `AUTH` - Authentication Event
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publisher_name:
          type: string
          format: email
          readOnly: true
        department_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_deleted:
          type: boolean
        title:
          type: string
          maxLength: 255
        content:
          type: string
        is_pinned:
          type: boolean
        publish_date:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        organization:
          type: string
          format: uuid
        published_by:
          type: string
          format: uuid
          readOnly: true
        target_department:
          type: string
          format: uuid
          nullable: true
      required:
      - content
      - created_at
      - department_name
      - id
      - organization
      - publish_date
      - published_by
      - publisher_name
      - title
      - updated_at
