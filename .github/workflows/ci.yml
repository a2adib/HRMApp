name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Health Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrm_platform
          POSTGRES_USER: hrm_user
          POSTGRES_PASSWORD: hrm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-enterprise-hrm-platform-12345
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgresql://hrm_user:hrm_password@localhost:5432/hrm_platform
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      WIFI_INGEST_API_KEY: ci-internal-wifi-secret-key-999

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django Configuration & System Check
        run: |
          python backend/manage.py check

      - name: Apply Database Migrations
        run: |
          python backend/manage.py migrate

      - name: Seed Demo Data
        run: |
          python backend/manage.py seed_demo_data

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: hrm_frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./hrm_frontend
        run: |
          npm ci || npm install

      - name: Build React Frontend
        working-directory: ./hrm_frontend
        run: |
          npm run build

  mobile-typecheck:
    name: Mobile App TypeScript Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./hrm_mobile
        run: |
          npm install --legacy-peer-deps

      - name: TypeScript Typecheck
        working-directory: ./hrm_mobile
        run: |
          npx tsc --noEmit
